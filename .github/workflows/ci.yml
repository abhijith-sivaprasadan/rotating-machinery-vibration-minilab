name: CI

on:
  schedule:
    - cron: "27 3 * * 3"
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  scientific-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility and syntax
        run: |
          python -m pip check
          python -m compileall -q src
      - name: Reproduce the report from known synthetic tones
        run: python .github/scripts/check_synthetic_signals.py
